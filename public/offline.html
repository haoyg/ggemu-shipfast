<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>当前处于离线状态 | POKOPIE</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 2rem));
        text-align: center;
      }

      img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
      }

      p {
        margin: 1rem 0 0;
        color: #cbd5e1;
        line-height: 1.75;
      }

      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #ec4899;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="POKOPIE" src="/logo-128.png" width="128" height="128" />
      <h1>当前处于离线状态</h1>
      <p>请检查网络连接。恢复联网后，可以重新加载页面继续浏览和游玩。</p>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </main>
  </body>
</html>
